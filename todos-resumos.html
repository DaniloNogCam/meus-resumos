<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Resumos | Todos os resumos</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- O header é igual em todas as páginas -->
  <header class="header">
    <a href="index.html" class="logo">
      <span class="logo-icone">R</span>
      <span>Meus Resumos</span>
    </a>

    <nav>
      <ul class="menu">
        <li><a href="adicionar-resumo.html" class="abrir-seletor">Adicionar resumo</a></li>
        <!-- A classe "ativo" destaca o link da página em que estamos -->
        <li><a href="todos-resumos.html" class="ativo">Todos os resumos</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1 class="titulo-pagina">Todos os resumos</h1>
    <p class="texto-suave espaco-abaixo">Um resumo recém-enviado pode levar cerca de 1 minuto para abrir.</p>

    <!-- O script.js preenche esta div com os resumos salvos -->
    <div id="lista-resumos">
      <p class="texto-suave">Carregando...</p>
    </div>
  </main>

  <footer class="rodape">
    <p>Meus Resumos · Ciência da Computação</p>
  </footer>

  <!-- Input de arquivo escondido (hidden). O script.js "clica" nele
       quando você clica em "Adicionar resumo", abrindo o explorador.
       accept: mostra só PDFs | multiple: permite escolher vários -->
  <input type="file" id="seletor-pdf" accept="application/pdf" multiple hidden>

  <!-- O script fica no fim do body para carregar depois do HTML -->
  <script src="script.js"></script>

</body>

</html>
